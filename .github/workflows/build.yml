name: Build and test (no photo uploads)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: swift test --package-path Core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s fixtures -p 'test_*.py'
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile unsigned simulator application
        run: xcodebuild -project CleanSlate.xcodeproj -scheme CleanSlate -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS unit tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{print $2; exit}')
          if [[ -z "$SIMULATOR_ID" ]]; then echo 'No iPhone simulator on runner'; exit 2; fi
          xcodebuild -project CleanSlate.xcodeproj -scheme CleanSlate -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
