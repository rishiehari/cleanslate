name: CleanSlate
options:
  bundleIdPrefix: org.cleanslate
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: org.cleanslate.free
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: CleanSlate
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Analyze photos privately on this device to find redundant pictures and request user-approved deletions.'
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  CleanSlateCore:
    path: Core
targets:
  CleanSlate:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - org.cleanslate.free.scan
          - org.cleanslate.free.continued.*
        UIBackgroundModes:
          - processing
    dependencies:
      - package: CleanSlateCore
        product: CleanSlateCore
      - sdk: libsqlite3.tbd
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets:
        - CleanSlateTests
        - CleanSlateUITests
  CleanSlateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
    dependencies:
      - target: CleanSlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cleanslate.free.tests
        GENERATE_INFOPLIST_FILE: YES
  CleanSlateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CleanSlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cleanslate.free.uitests
        GENERATE_INFOPLIST_FILE: YES
